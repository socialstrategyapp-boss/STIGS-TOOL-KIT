name: Generate SBOM

on:
  push:
    branches: ["main"]
  release:
    types: [created]
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday generation.

permissions:
  contents: read
  id-token: write # Required for OIDC-based attestation.

jobs:
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate SBOM
        # anchore/sbom-action catalogues every file and dependency found in the repo
        # and produces a machine-readable Software Bill of Materials in SPDX-JSON format.
        # The resulting artifact is uploaded automatically to the workflow run.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90
