name: Generate SBOM

on:
  push:
    branches: ["main"]
  release:
    types: [created]
  schedule:
    - cron: "0 6 * * 0" # Weekly Sunday generation.

permissions:
  contents: read
  id-token: write # Required for OIDC-based attestation.

jobs:
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Generate SBOM
        # anchore/sbom-action catalogues every file and dependency found in the repo
        # and produces a machine-readable Software Bill of Materials in SPDX-JSON format.
        # The resulting artifact is uploaded automatically to the workflow run.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-artifact-retention: 90
