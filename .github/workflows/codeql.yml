name: CodeQL Analysis

on:
  push:
    branches: ["main"] # Customize protected branches as needed.
  pull_request:
    branches: ["main"] # Add additional target branches if required.
  schedule:
    - cron: "30 4 * * 1" # Weekly Monday scan.

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # Tighten to 'block' with an allowlist once egress is profiled.

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          # Set this to match the languages in your repository.
          # Example for multi-language projects: "javascript-typescript,python"
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
